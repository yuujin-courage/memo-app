<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="メモ">
<title>タイムラインメモ</title>
<style>
:root{
  --bg:#eef1f4; --surface:#fff; --ink:#1b2430; --sub:#6b7686; --line:#cfd6de;
  --accent:#2f5d8a; --accent-ink:#fff; --chip:#e2e8ef; --danger:#b3392f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171d; --surface:#1b222b; --ink:#e6ebf1; --sub:#8b97a7; --line:#2d3743;
    --accent:#7fb0e0; --accent-ink:#0f1720; --chip:#262f3a; --danger:#e57b70; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1b222b; --ink:#e6ebf1; --sub:#8b97a7; --line:#2d3743;
  --accent:#7fb0e0; --accent-ink:#0f1720; --chip:#262f3a; --danger:#e57b70; color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{padding:12px 16px 8px;background:var(--bg)}
h1{font-size:20px;margin:0 0 8px;font-weight:700;letter-spacing:.02em}
#search{width:100%;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;font:inherit;font-size:14px;padding:3px 11px;border-radius:999px;background:var(--chip);color:var(--ink);cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink)}
main{flex:1;overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.day{position:sticky;top:0;background:var(--bg);margin:0;padding:10px 0 6px;font-size:14px;font-weight:700;color:var(--sub);z-index:2}
.entry{display:grid;grid-template-columns:48px 14px 1fr;column-gap:8px;align-items:start}
.time{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums;padding-top:12px;text-align:right}
.rail{position:relative;align-self:stretch}
.rail::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--line)}
.rail::after{content:"";position:absolute;left:1px;top:19px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.card{background:var(--surface);border-radius:12px;padding:10px 12px;margin:6px 0;border:1px solid var(--line)}
.text{white-space:pre-wrap;word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:13px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;font-family:inherit}
.acts{display:flex;gap:14px;margin-top:6px}
.acts button{font:inherit;font-size:13px;color:var(--sub);background:none;border:0;padding:2px 0;cursor:pointer}
.acts .del{color:var(--danger)}
.empty{text-align:center;color:var(--sub);padding:48px 16px}
footer{background:var(--surface);border-top:1px solid var(--line);padding:10px 12px}
footer textarea,footer input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:none}
footer textarea{height:64px;display:block}
.row{display:flex;gap:8px;margin-top:8px}
.row input{flex:1;min-width:0}
#save{flex:none;font:inherit;font-weight:700;border:0;border-radius:10px;padding:0 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
#cancel{flex:none;font:inherit;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:none;color:var(--sub);cursor:pointer}
#suggest{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
#suggest:empty{display:none}
.top{display:flex;align-items:center;justify-content:space-between}
#bk{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 12px;cursor:pointer}
dialog{width:min(92vw,420px);border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{font-size:17px;margin:0 0 4px}
dialog p{font-size:13px;color:var(--sub);margin:4px 0 10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer}
.btns .pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
#imp{width:100%;height:110px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:14px;resize:none}
#msg{font-size:13px;color:var(--accent);min-height:1.4em;margin:8px 0 0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin-top:8px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;background:var(--chip);display:block}
.prow{display:flex;gap:10px;align-items:center;margin-top:8px}
#addp{flex:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer}
#prev{display:flex;gap:8px;overflow-x:auto;padding:6px 6px 0 0;scrollbar-width:none}
.pv{position:relative;flex:none}
.pv img{width:44px;height:44px;object-fit:cover;border-radius:8px;display:block;background:var(--chip)}
.pv button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--danger);color:#fff;font-size:13px;line-height:20px;padding:0;cursor:pointer}
#lb{width:auto;padding:0;border:0;background:transparent;overflow:visible}
#lb::backdrop{background:rgba(0,0,0,.88)}
#lb img{max-width:94vw;max-height:86vh;display:block;border-radius:8px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
</style>
</head>
<body>
<header>
  <div class="top"><h1>タイムラインメモ</h1><button id="bk">バックアップ</button></div>
  <input id="search" type="search" placeholder="メモを検索" aria-label="メモを検索">
  <div class="chips" id="filters"></div>
</header>
<main id="list"></main>
<footer>
  <textarea id="text" placeholder="いま何してる？思いついたことをメモ" aria-label="メモ本文"></textarea>
  <div class="prow"><button id="addp" type="button">写真を追加</button><div id="prev"></div></div>
  <input id="pic" type="file" accept="image/*" multiple hidden>
  <div class="row">
    <input id="tags" placeholder="タグ（スペース区切り）" aria-label="タグ" enterkeyhint="done">
    <button id="cancel" hidden>やめる</button>
    <button id="save">記録</button>
  </div>
  <div id="suggest"></div>
</footer>
<dialog id="lb"><img id="lbi" alt="写真"></dialog>
<dialog id="dlg">
  <h2>バックアップ</h2>
  <p id="info"></p>
  <label style="display:block;font-size:14px;margin:0 0 8px"><input type="checkbox" id="wp" checked> 写真も含める</label>
  <div class="btns"><button class="pri" id="exp">.mdで書き出す</button><button id="cp">コピー</button></div>
  <textarea id="imp" placeholder="書き出したMarkdownをここに貼り付けて復元" aria-label="復元用のMarkdown"></textarea>
  <div class="btns" style="margin-top:8px"><button id="imb">読み込む</button><button id="cls">閉じる</button></div>
  <p id="msg"></p>
</dialog>
<script>
(function(){
  var KEY="memo-timeline-v1", notes=[], filterTag=null, editingId=null, pend=[], cache={}, dbp=null;
  function db(){if(!dbp)dbp=new Promise(function(res,rej){try{var r=indexedDB.open("memo-photos-v1",1);r.onupgradeneeded=function(){r.result.createObjectStore("p")};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}});return dbp}
  function tx(mode,fn){return db().then(function(d){return new Promise(function(res,rej){var t=d.transaction("p",mode),q=fn(t.objectStore("p"));t.oncomplete=function(){res(q&&q.result)};t.onerror=t.onabort=function(){rej(t.error)}})})}
  function putP(id,b){return tx("readwrite",function(s){return s.put(b,id)})}
  function getP(id){return tx("readonly",function(s){return s.get(id)})}
  function delP(id){return tx("readwrite",function(s){return s.delete(id)}).catch(function(){})}
  function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function urlOf(id){if(cache[id])return Promise.resolve(cache[id]);return getP(id).then(function(b){return b?(cache[id]=URL.createObjectURL(b)):null}).catch(function(){return null})}
  function shrink(file){
    var p=window.createImageBitmap?createImageBitmap(file,{imageOrientation:"from-image"}).catch(function(){return null}):Promise.resolve(null);
    return p.then(function(bm){
      if(bm)return bm;
      return new Promise(function(res,rej){var im=new Image();im.onload=function(){res(im)};im.onerror=rej;im.src=URL.createObjectURL(file)})
    }).then(function(src){
      var w=src.width,h=src.height,k=Math.min(1,1600/Math.max(w,h)),c=document.createElement("canvas");
      c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(src,0,0,c.width,c.height);
      return new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej(new Error("blob"))},"image/jpeg",0.82)})})}
  function renderPrev(){
    var box=$("prev");box.textContent="";
    pend.forEach(function(p,i){var w=el("div","pv"),im=document.createElement("img");im.alt="";if(p.url)im.src=p.url;
      var x=el("button","","×");x.type="button";x.setAttribute("aria-label","写真を外す");x.onclick=function(){pend.splice(i,1);renderPrev()};
      w.appendChild(im);w.appendChild(x);box.appendChild(w)})}
  async function addFiles(files){
    var list=Array.prototype.slice.call(files);
    for(var i=0;i<list.length;i++){
      try{var b=await shrink(list[i]);pend.push({id:gid(),blob:b,url:URL.createObjectURL(b),isNew:true});renderPrev()}
      catch(e){alert("写真を読み込めませんでした。")}}}
  var $=function(id){return document.getElementById(id)};
  function load(){try{var r=localStorage.getItem(KEY);notes=r?JSON.parse(r):[]}catch(e){notes=[]}if(!Array.isArray(notes))notes=[]}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){alert("保存できませんでした。ブラウザの設定を確認してください。")}}
  function parseTags(s){var out=[];s.split(/[\s,、]+/).forEach(function(t){t=t.replace(/^[#＃]+/,"");if(t&&out.indexOf(t)<0)out.push(t)});return out}
  function allTags(){var c={};notes.forEach(function(n){n.tags.forEach(function(t){c[t]=(c[t]||0)+1})});return Object.keys(c).sort(function(a,b){return c[b]-c[a]})}
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function pad(n){return n<10?"0"+n:""+n}
  function dayLabel(d){var t=new Date(),y=new Date();y.setDate(t.getDate()-1);
    var base=(d.getMonth()+1)+"月"+d.getDate()+"日（"+"日月火水木金土".charAt(d.getDay())+"）";
    if(d.toDateString()===t.toDateString())return "今日 "+base;
    if(d.toDateString()===y.toDateString())return "昨日 "+base;
    return (d.getFullYear()!==t.getFullYear()?d.getFullYear()+"年":"")+base}

  function renderFilters(){
    var box=$("filters");box.textContent="";
    var tags=allTags();if(!tags.length)return;
    var all=el("button","chip"+(filterTag?"":" on"),"すべて");all.onclick=function(){filterTag=null;render()};box.appendChild(all);
    tags.forEach(function(t){var b=el("button","chip"+(filterTag===t?" on":""),"#"+t);b.onclick=function(){filterTag=(filterTag===t?null:t);render()};box.appendChild(b)});
  }
  function renderSuggest(){
    var box=$("suggest");box.textContent="";
    var cur=parseTags($("tags").value);
    allTags().slice(0,12).forEach(function(t){
      if(cur.indexOf(t)>=0)return;
      var b=el("button","chip","#"+t);b.type="button";
      b.onclick=function(){var v=$("tags").value.replace(/\s+$/,"");$("tags").value=(v?v+" ":"")+t+" ";renderSuggest()};
      box.appendChild(b)});
  }
  function render(){
    renderFilters();renderSuggest();
    var q=$("search").value.trim().toLowerCase(), list=$("list");list.textContent="";
    var items=notes.filter(function(n){
      if(filterTag&&n.tags.indexOf(filterTag)<0)return false;
      if(q&&(n.text+" "+n.tags.join(" ")).toLowerCase().indexOf(q)<0)return false;return true})
      .sort(function(a,b){return b.at-a.at});
    if(!items.length){list.appendChild(el("div","empty",notes.length?"条件に合うメモがありません":"最初のメモを書いてみましょう。時刻は自動で記録されます。"));return}
    var last="";
    items.forEach(function(n){
      var d=new Date(n.at),ds=d.toDateString();
      if(ds!==last){list.appendChild(el("h2","day",dayLabel(d)));last=ds}
      var row=el("div","entry");
      row.appendChild(el("div","time",pad(d.getHours())+":"+pad(d.getMinutes())));
      row.appendChild(el("div","rail"));
      var card=el("div","card");if(n.text)card.appendChild(el("div","text",n.text));
      if(n.photos&&n.photos.length){var g=el("div","photos");n.photos.forEach(function(id){var im=document.createElement("img");im.alt="写真";im.loading="lazy";urlOf(id).then(function(u){if(u)im.src=u});im.onclick=function(){if(im.src){$("lbi").src=im.src;$("lb").showModal()}};g.appendChild(im)});card.appendChild(g)}
      if(n.tags.length){var tg=el("div","tags");n.tags.forEach(function(t){var b=el("button","tag","#"+t);b.onclick=function(){filterTag=t;render()};tg.appendChild(b)});card.appendChild(tg)}
      var ac=el("div","acts"),e=el("button","","編集"),x=el("button","del","削除");
      e.onclick=function(){startEdit(n.id)};
      x.onclick=function(){if(confirm("このメモを削除しますか？")){(n.photos||[]).forEach(delP);notes=notes.filter(function(m){return m.id!==n.id});persist();if(editingId===n.id)endEdit();render()}};
      ac.appendChild(e);ac.appendChild(x);card.appendChild(ac);row.appendChild(card);list.appendChild(row)});
  }
  function startEdit(id){
    var n=notes.filter(function(m){return m.id===id})[0];if(!n)return;
    editingId=id;$("text").value=n.text;$("tags").value=n.tags.join(" ");
    pend=(n.photos||[]).map(function(p){return {id:p,url:"",isNew:false}});renderPrev();
    pend.forEach(function(p){urlOf(p.id).then(function(u){p.url=u||"";renderPrev()})});
    $("save").textContent="更新";$("cancel").hidden=false;$("text").focus();renderSuggest();
  }
  function endEdit(){editingId=null;pend=[];renderPrev();$("text").value="";$("tags").value="";$("save").textContent="記録";$("cancel").hidden=true;renderSuggest()}
  function save(){
    var text=$("text").value.trim();
    if(!text&&!pend.length){$("text").focus();return}
    var tags=parseTags($("tags").value),ids=pend.map(function(p){return p.id}),news=pend.filter(function(p){return p.isNew});
    $("save").disabled=true;
    Promise.all(news.map(function(p){return putP(p.id,p.blob)})).then(function(){
      news.forEach(function(p){cache[p.id]=p.url});
      if(editingId){notes.forEach(function(n){if(n.id===editingId){(n.photos||[]).forEach(function(o){if(ids.indexOf(o)<0)delP(o)});n.text=text;n.tags=tags;n.photos=ids}})}
      else{notes.push({id:gid(),at:Date.now(),text:text,tags:tags,photos:ids})}
      persist();endEdit();render();$("list").scrollTop=0;
    }).catch(function(){alert("写真を保存できませんでした。")}).then(function(){$("save").disabled=false});
  }
  $("save").onclick=save;
  $("cancel").onclick=endEdit;
  $("tags").addEventListener("input",renderSuggest);
  $("tags").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();save()}});
  $("search").addEventListener("input",render);
  function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function blobToUrl(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(b)})}
  function urlToBlob(u){var m=u.match(/^data:([^;]+);base64,(.*)$/);if(!m)return null;var bin=atob(m[2]),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m[1]})}
  async function toMd(withP){
    var s="# タイムラインメモ\n\n",last="",arr=notes.slice().sort(function(a,b){return b.at-a.at});
    for(var j=0;j<arr.length;j++){
      var n=arr[j],d=new Date(n.at),k=ymd(d);
      if(k!==last){s+="## "+k+"\n\n";last=k}
      s+="### "+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())+"\n"+n.text+"\n";
      if(withP&&n.photos)for(var q=0;q<n.photos.length;q++){try{var bl=await getP(n.photos[q]);if(bl)s+="![]("+await blobToUrl(bl)+")\n"}catch(e){}}
      if(n.tags.length)s+="タグ: "+n.tags.map(function(t){return "#"+t}).join(" ")+"\n";
      s+="\n"}
    return s}
  var PH=/^!\[\]\((data:image\/[a-z0-9.+-]+;base64,[A-Za-z0-9+\/=]+)\)\s*$/;
  function parseMd(src){
    var out=[],date=null,cur=null;
    function flush(){
      if(!cur)return;var photos=[],L=[],tags=[];
      cur.lines.forEach(function(l){var m=l.match(PH);if(m)photos.push(m[1]);else L.push(l)});
      while(L.length&&!L[L.length-1].trim())L.pop();
      var m2=L.length&&L[L.length-1].match(/^タグ: (.*)$/);
      if(m2){tags=parseTags(m2[1]);L.pop()}
      var text=L.join("\n").trim();
      if(text||photos.length)out.push({at:cur.at,text:text,tags:tags,photos:photos});
      cur=null}
    src.split(/\r?\n/).forEach(function(line){
      var d=line.match(/^## (\d{4})-(\d{2})-(\d{2})\s*$/);
      if(d){flush();date=d;return}
      var t=line.match(/^### (\d{2}):(\d{2}):(\d{2})\s*$/);
      if(t&&date){flush();cur={at:new Date(+date[1],+date[2]-1,+date[3],+t[1],+t[2],+t[3]).getTime(),lines:[]};return}
      if(cur)cur.lines.push(line)});
    flush();return out}
  function msg(s){$("msg").textContent=s}
  function openBk(){$("info").textContent="全メモ（"+notes.length+"件）をMarkdown形式で保存します。写真を含めるとファイルが大きくなります。";msg("");$("imp").value="";$("dlg").showModal()}
  async function exportMd(){
    if(!notes.length){msg("書き出すメモがありません");return}
    msg("作成中…");
    var md=await toMd($("wp").checked),name="memo-"+ymd(new Date())+".md";
    try{var f=new File([md],name,{type:"text/markdown"});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});msg("書き出しました");return}
    }catch(e){if(e&&e.name==="AbortError"){msg("キャンセルしました");return}}
    try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([md],{type:"text/markdown"}));a.download=name;document.body.appendChild(a);a.click();a.remove();msg("書き出しました")}
    catch(e){msg("書き出せませんでした。写真をオフにするか「コピー」を使ってください。")}}
  async function copyMd(){
    if(!notes.length){msg("コピーするメモがありません");return}
    var md=await toMd($("wp").checked);
    try{await navigator.clipboard.writeText(md);msg("コピーしました")}
    catch(e){$("imp").value=md;$("imp").select();msg("自動でコピーできませんでした。下の欄を全選択してコピーしてください")}}
  async function importMd(){
    var items=parseMd($("imp").value);
    if(!items.length){msg("読み込めるメモが見つかりません");return}
    msg("読み込み中…");var added=0;
    for(var i=0;i<items.length;i++){
      var it=items[i];
      if(notes.some(function(n){return n.at===it.at&&n.text===it.text}))continue;
      var ids=[];
      for(var j=0;j<it.photos.length;j++){var b=urlToBlob(it.photos[j]);if(!b)continue;var id=gid();try{await putP(id,b);ids.push(id)}catch(e){}}
      notes.push({id:gid(),at:it.at,text:it.text,tags:it.tags,photos:ids});added++}
    persist();render();$("imp").value="";
    msg(added+"件を追加しました（重複"+(items.length-added)+"件はスキップ）")}
  $("addp").onclick=function(){$("pic").click()};
  $("pic").onchange=function(){addFiles(this.files);this.value=""};
  $("lb").onclick=function(){this.close()};
  $("bk").onclick=openBk;
  $("exp").onclick=exportMd;
